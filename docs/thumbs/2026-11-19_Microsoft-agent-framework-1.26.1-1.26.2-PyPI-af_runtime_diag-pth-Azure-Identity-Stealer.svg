<text class="footerH" x="34" y="1198">Anchors: agent_framework_meta.pth, af_runtime_diag.pth/.py, pinned 1.26.1/1.26.2 installs, webhook.site egress, two User-Agents</text>
<text class="footerT" x="34" y="1218">Rules in this folder: Sigma 01-05, KQL k1-k3, YARA 2 rules, Suricata sids 9149001-9149004, PEAK hunts H1-H3.</text>
<text class="footerT" x="34" y="1236">No CVE or GHSA assigned, so no kev.md. Indicators are thin (no 1.26.1 hashes, no C2 beyond webhook.site): hunt leads, not proof.</text>
<text class="footerT" x="34" y="1254">Act: find the versions and .pth files, isolate, rebuild with hash pins, rotate every reachable secret, audit cloud sign-ins.</text>
