<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">Microsoft agent-framework 1.26.1 and 1.26.2 - PyPI startup-hook credential stealer</title>
<desc id="d">Two-lane kill chain. Left lane: 1 unauthorized upload of built-only wheels, 2 version 1.26.1 with agent_framework_meta.pth, 3 version 1.26.2 with af_runtime_diag.pth and restored __init__, 4 quarantine after about 45 minutes, 5 startup hook runs on every Python launch, 6 credential collection and webhook.site exfiltration, 7 stolen identities to be used later (not observed). Right lane: attribution (none), artifacts and window, credential targets, lessons, response. Detection anchors: the pth files, pinned installs, webhook.site egress and user agents, IMDS from python.</desc>
