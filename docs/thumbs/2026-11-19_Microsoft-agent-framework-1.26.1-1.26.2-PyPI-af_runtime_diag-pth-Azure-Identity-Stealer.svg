<circle class="badge" cx="50" cy="140" r="14"/>
<text class="badgeText" x="50" y="145">1</text>
<text class="label" x="76" y="144">Unauthorized upload outside the release process</text>
<text class="sub" x="40" y="168">Wheels only (no sdist); no matching release in Microsoft repo</text>
<text class="sub" x="40" y="184">PyPI account vibiret created same day (SafeDep; unconfirmed)</text>
<text class="sub" x="40" y="200">Real publishing path still unknown; investigation open</text>
<text class="mono" x="40" y="226">T1195.001  T1078</text>
<text class="mono" x="40" y="244">iocs.csv</text>
<rect class="stage" x="30" y="270" width="395" height="135"/>
<circle class="badge" cx="50" cy="290" r="14"/>
<text class="badgeText" x="50" y="295">2</text>
<text class="label" x="76" y="294">agent-framework 1.26.1 published (20:35 UTC)</text>
<text class="sub" x="40" y="318">2026-11-17; adds agent_framework_meta.pth</text>
<text class="sub" x="40" y="334">__init__.py calls _telemetry._start()</text>
<text class="sub" x="40" y="350">Collector in agent_framework_meta/_telemetry.py</text>
<text class="mono" x="40" y="376">T1195.001  T1546.018</text>
<text class="mono" x="40" y="394">Sigma 01, 02  KQL k1</text>
<rect class="stage" x="30" y="420" width="395" height="135"/>
<circle class="badge" cx="50" cy="440" r="14"/>
<text class="badgeText" x="50" y="445">3</text>
<text class="label" x="76" y="444">agent-framework 1.26.2 published (21:08 UTC)</text>
<text class="sub" x="40" y="468">Moves to af_runtime_diag.pth + af_runtime_diag.py</text>
<text class="sub" x="40" y="484">Restores __init__.py byte for byte (diff review misses it)</text>
<text class="sub" x="40" y="500">Adds GitHub Actions OIDC token collection</text>
<text class="mono" x="40" y="526">T1195.001  T1027</text>
<text class="mono" x="40" y="544">Sigma 01  KQL k1  YARA</text>
<rect class="stageK" x="30" y="570" width="395" height="135"/>
<circle class="badgeK" cx="50" cy="590" r="14"/>
<text class="badgeText" x="50" y="595">4</text>
<text class="label" x="76" y="594">Both versions pulled and quarantined (~21:20 UTC)</text>
<text class="sub" x="40" y="618">About 45 minutes of exposure, ~190k downloads a month</text>
<text class="sub" x="40" y="634">Loose pins like agent-framework&gt;=1.26 could resolve to it</text>
<text class="sub" x="40" y="650">Removal does not invalidate stolen secrets</text>
<text class="mono" x="40" y="676">T1195.001</text>
<text class="mono" x="40" y="694">KQL k2  Hunt H1</text>
<rect class="stageK" x="30" y="720" width="395" height="135"/>
<circle class="badgeK" cx="50" cy="740" r="14"/>
<text class="badgeText" x="50" y="745">5</text>
<text class="label" x="76" y="744">Startup hook runs on every Python launch</text>
<text class="sub" x="40" y="768">pth line imports the module; no import of the package needed</text>
<text class="sub" x="40" y="784">Unix: fork and detach; elsewhere a daemon thread</text>
<text class="sub" x="40" y="800">_AF_TEL=1 guards re-run in child processes</text>
<text class="mono" x="40" y="826">T1546.018  T1059.006</text>
<text class="mono" x="40" y="844">Sigma 01  YARA  Hunt H1</text>
<rect class="stageK" x="30" y="870" width="395" height="135"/>
<circle class="badgeK" cx="50" cy="890" r="14"/>
<text class="badgeText" x="50" y="895">6</text>
<text class="label" x="76" y="894">Credentials collected and sent to webhook.site</text>
<text class="sub" x="40" y="918">Env of this process and up to 300 others via /proc/*/environ</text>
<text class="sub" x="40" y="934">Azure managed-identity tokens (12 resources), ADO and GH OIDC</text>
<text class="sub" x="40" y="950">JSON, zlib, Base64 POST; UA af-runtime-diagnostics/1</text>
<text class="mono" x="40" y="976">T1552.001  T1552.005  T1041</text>
<text class="mono" x="40" y="994">Sigma 03-05  Suricata 9149001-4</text>
<rect class="stageK" x="30" y="1020" width="395" height="135"/>
<circle class="badgeK" cx="50" cy="1040" r="14"/>
<text class="badgeText" x="50" y="1045">7</text>
<text class="label" x="76" y="1044">Stolen identities reused after the window (not observed)</text>
<text class="sub" x="40" y="1068">No post-compromise abuse published as of 2026-11-18</text>
<text class="sub" x="40" y="1084">Rotate Azure SP, ADO, GitHub, PyPI, HF, Docker secrets</text>
<text class="sub" x="40" y="1100">Audit Entra, ADO and Actions logs since 2026-11-17</text>
<text class="mono" x="40" y="1126">T1078.004  T1528</text>
<text class="mono" x="40" y="1144">KQL k3  Hunt H3</text>
<rect class="op" x="460" y="125" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="145" r="14"/>
<text class="badgeText" x="480" y="150">A</text>
<text class="label" x="506" y="149">Attribution: none published</text>
<text class="sub" x="470" y="173">No actor named by SecurityWeek, Orca or Socket</text>
<text class="sub" x="470" y="189">Account vibiret is a lead only; link not confirmed</text>
<text class="sub" x="470" y="205">Same .pth startup-hook class as LiteLLM 1.107.0 (10-29)</text>
<text class="mono" x="470" y="251">Confidence: mechanics high, actor none</text>
<rect class="opK" x="460" y="295" width="395" height="155"/>
<circle class="badgeK" cx="480" cy="315" r="14"/>
<text class="badgeText" x="480" y="320">B</text>
<text class="label" x="506" y="319">Artifacts and exposure window</text>
<text class="sub" x="470" y="343">agent-framework 1.26.1 and 1.26.2; last clean 1.26.0</text>
<text class="sub" x="470" y="359">Siblings (agent-framework-core +22) not affected</text>
<text class="sub" x="470" y="375">No CVE or GHSA; no hashes for 1.26.1 files</text>
<text class="mono" x="470" y="421">Window 2026-11-17 20:35 to ~21:20 UTC</text>
<rect class="op" x="460" y="465" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="485" r="14"/>
<text class="badgeText" x="480" y="490">C</text>
<text class="label" x="506" y="489">What the stealer takes</text>
<text class="sub" x="470" y="513">Env vars: TOKEN SECRET KEY AZURE AWS GITHUB OPENAI HF_</text>
<text class="sub" x="470" y="529">Azure CLI state, .npmrc, pip.conf, .netrc, .git-credentials</text>
<text class="sub" x="470" y="545">Docker config.json, Hugging Face tokens, .env files</text>
<text class="mono" x="470" y="591">Exfil: webhook.site only (Socket)</text>
<rect class="op" x="460" y="635" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="655" r="14"/>
<text class="badgeText" x="480" y="660">D</text>
<text class="label" x="506" y="659">Pipeline lessons</text>
<text class="sub" x="470" y="683">Pin by hash; a new release is not a trusted release</text>
<text class="sub" x="470" y="699">Trusted publishing plus a maintainer-account audit</text>
<text class="sub" x="470" y="715">Treat .pth and sitecustomize writes as high-signal</text>
<text class="mono" x="470" y="761">Review wheels, not just source diffs</text>
<rect class="op" x="460" y="805" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="825" r="14"/>
<text class="badgeText" x="480" y="830">E</text>
<text class="label" x="506" y="829">Response and caveats</text>
<text class="sub" x="470" y="853">Search locks, images, caches for 1.26.1 / 1.26.2</text>
<text class="sub" x="470" y="869">Isolate, rebuild clean, rotate every reachable secret</text>
<text class="sub" x="470" y="885">IOC set is small; webhook.site is dual-use</text>
<text class="mono" x="470" y="931">Hunts H1 H2 H3  KEV: no CVE</text>
