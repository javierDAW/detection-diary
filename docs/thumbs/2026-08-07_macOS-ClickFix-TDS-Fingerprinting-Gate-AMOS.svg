<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">macOS ClickFix TDS fingerprinting-gate kill chain</title>
<desc id="d">Two-lane kill chain. Left lane is the victim path: a gated web visit to an algorithmically named file-word-word front-end domain returns a small JavaScript profiler; the fingerprint gate reads navigator, screen, WebGL, timezone, iframe and touch signals and runs devtools and canPlayType tripwires, tagging the submission mode php; qualifying Macs get a GitHub-themed Download for macOS lure with a forged Verified Publisher badge and a copy-to-Terminal curl one-liner; the user pastes it, curl pulls staged scripts from a slash curl slash id path, base64 and gunzip decode them and xattr minus c plus chmod plus x prepare the payload; Atomic Stealer or MacSync then steals Keychain, browser and wallet data and exfiltrates over HTTP POST. Right lane is the operator infrastructure: domain generation of 250-plus disposable front-ends, the server-side Traffic Distribution System gate that evaluates the submitted fingerprint and selects who sees the lure, a decoy branch for bots and non-macOS visitors, a staging host serving the curl scripts and AMOS, and a collection endpoint receiving exfiltration. Detection anchors: the gate artifacts served in the clear, and the curl-piped-to-shell Terminal execution.</desc>
