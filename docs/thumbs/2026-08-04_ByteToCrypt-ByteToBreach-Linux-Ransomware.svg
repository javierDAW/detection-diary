<circle class="badge" cx="50" cy="290" r="14"/>
<text class="badgeText" x="50" y="295">2</text>
<text class="label" x="75" y="294">Recon + lateral movement</text>
<text class="sub" x="40" y="318">Exploit old software, brute AD</text>
<text class="sub" x="40" y="334">SSH to Unix, PsExec to Windows</text>
<text class="sub" x="40" y="350">One account fans out widely</text>
<text class="mono" x="40" y="376">T1021.004 / T1021.002</text>
