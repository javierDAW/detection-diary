<text class="mono" x="40" y="1126">MITRE T1485 / T1490</text>
<text class="mono" x="40" y="1144">immutable backups are the fix</text>

<rect class="op" x="460" y="125" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="145" r="14"/>
<text class="badgeText" x="480" y="150">A</text>
<text class="label" x="505" y="149">Sample profile</text>
<text class="sub" x="470" y="173">ELF64 x86-64, stripped</text>
<text class="sub" x="470" y="189">Static musl + OpenSSL 3.5.7</text>
<text class="sub" x="470" y="205">Alpine GCC 15.2.0, ~4.2 MB</text>
<text class="sub" x="470" y="221">8 named app routines</text>
<text class="mono" x="470" y="251">md5 ffd7c9a1...75c9b7</text>
<text class="mono" x="470" y="269">only 8/63 AV at first upload</text>

<rect class="op" x="460" y="295" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="315" r="14"/>
<text class="badgeText" x="480" y="320">B</text>
<text class="label" x="505" y="319">Embedded config</text>
<text class="sub" x="470" y="343">RSA-4096 pubkey + ransom note</text>
<text class="sub" x="470" y="359">Base64 over single-byte XOR</text>
<text class="sub" x="470" y="375">Constant key 0xAA, no integrity</text>
<text class="sub" x="470" y="391">Defeats a naive strings pass</text>
<text class="mono" x="470" y="421">MITRE T1027 / T1140</text>
<text class="mono" x="470" y="439">SPKI sha256 b1583ddd...4d37</text>

<rect class="op" x="460" y="465" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="485" r="14"/>
<text class="badgeText" x="480" y="490">C</text>
<text class="label" x="505" y="489">Per-file hybrid crypto</text>
<text class="sub" x="470" y="513">RAND_bytes AES-256 key + IV</text>
<text class="sub" x="470" y="529">RSA-OAEP wrap = 512 bytes</text>
<text class="sub" x="470" y="545">AES-256-CBC, PKCS#7 padding</text>
<text class="sub" x="470" y="561">No auth tag, no magic/size</text>
<text class="mono" x="470" y="591">hdr: 00 02 | 512B key | 16B IV</text>
<text class="mono" x="470" y="609">RSA private key = recovery root</text>

<rect class="opK" x="460" y="635" width="395" height="155"/>
<circle class="badgeK" cx="480" cy="655" r="14"/>
<text class="badgeText" x="480" y="660">D</text>
<text class="label" x="505" y="659">Destructive rename chain</text>
<text class="sub" x="470" y="683">src -&gt; .tmp -&gt; unlink -&gt; .encrypted</text>
<text class="sub" x="470" y="699">All return values ignored</text>
<text class="sub" x="470" y="715">Failed write can precede delete</text>
<text class="sub" x="470" y="731">Announces false success</text>
<text class="mono" x="470" y="761">orphan .tmp = recovery chance</text>
<text class="mono" x="470" y="779">plaintext survivors possible</text>

<rect class="opK" x="460" y="805" width="395" height="155"/>
<circle class="badgeK" cx="480" cy="825" r="14"/>
<text class="badgeText" x="480" y="830">E</text>
<text class="label" x="505" y="829">Fixed anti-forensics</text>
<text class="sub" x="470" y="853">killall rsyslogd auditd journald</text>
<text class="sub" x="470" y="869">auditctl -e 0; dmesg -C</text>
<text class="sub" x="470" y="885">rm -rf /var/log/*; truncate utmp</text>
<text class="sub" x="470" y="901">history -c; wipe known_hosts</text>
<text class="mono" x="470" y="931">9 commands via system()</text>
<text class="mono" x="470" y="949">exact strings = host IOCs</text>

<rect class="op" x="460" y="975" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="995" r="14"/>
<text class="badgeText" x="480" y="1000">F</text>
<text class="label" x="505" y="999">Not ESXi-aware walker</text>
<text class="sub" x="470" y="1023">Generic CWD directory walk</text>
<text class="sub" x="470" y="1039">Single-threaded, full-file</text>
<text class="sub" x="470" y="1055">No device boundary; skips links</text>
<text class="sub" x="470" y="1071">Excludes .ssh .cfg pem note</text>
<text class="mono" x="470" y="1101">reaches VMs via datastore only</text>
<text class="mono" x="470" y="1119">restrict datastore mount/exec</text>

