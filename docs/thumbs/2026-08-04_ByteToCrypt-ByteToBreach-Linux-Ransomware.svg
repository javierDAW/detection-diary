<text class="footerH" x="30" y="1200">Detection anchors (red = behavioural must-catch; no CVE, no encryptor C2)</text>
<text class="footerT" x="30" y="1222">1) encryptor run from datastore (mass .encrypted via .tmp)  2) 9-command anti-forensics burst  3) systems + backup destruction</text>
<text class="footerT" x="30" y="1240">Recovery: RSA private key, live AES key from RAM, immutable/offline backups, plaintext survivors of the fragile rename chain.</text>
