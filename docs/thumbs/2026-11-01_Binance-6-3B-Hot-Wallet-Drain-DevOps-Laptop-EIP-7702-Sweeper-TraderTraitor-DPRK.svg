<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">Binance 6.3B hot-wallet drain - DevOps laptop, EIP-7702 sweeper, TraderTraitor attribution</title>
<desc id="d">Two-lane kill chain. Left lane (Binance side): 1 compromised DevOps engineer laptop, 2 service container submits unauthorized withdrawals, 3 EIP-7702 delegation on hot wallet Binance 14, 4 outflows from 2026-10-29 20:05 UTC across 10 chains, 5 deposit-wallet sweeps keep refilling the hot wallet, 6 pause and freezes, 7 open questions. Right lane (attacker and chain context): Tornado Cash funded operator wallet, code tests, type-4 transaction with 50 authorizations of which one hit, sweeper contract, THORChain laundering, TraderTraitor attribution by TRM and Chainalysis. Detection anchors are generic leads: workstation to container path, cloud credential reads, EIP-7702 delegation monitoring on owned addresses, withdrawal velocity.</desc>
