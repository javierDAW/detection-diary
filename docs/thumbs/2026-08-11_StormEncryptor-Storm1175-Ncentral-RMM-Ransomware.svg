<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">StormEncryptor kill chain - Storm-1175 via N-central RMM</title>
<desc id="d">Two lanes. Left: a victim estate - an exposed self-hosted N-able N-central RMM server exploited via the CVE-2026-18577 authentication bypass, the built-in Take Control feature pivoting to managed endpoints, persistence through a Cloudflare Tunnel service and a svchost.exe planted in the Documents folder, discovery with Advanced IP Scanner and remote access via AnyDesk or SimpleHelp, credential theft with Mimikatz from LSASS, data theft for double extortion, and finally StormEncryptor encryption that appends .encrypted and drops the README_FIRST note. Right: Storm-1175 infrastructure and tooling - CVE-2026-18577 exploitation, N-able-published exploitation and C2 IP addresses, the living-off-the-land RMM toolset, a cloudflared tunnel egress, the custom C++ StormEncryptor build, and the three-day extortion demand. Detection anchors: svchost.exe running from Documents, a Cloudflared service, the recon to credential-dump to encryption sequence, and the .encrypted and README_FIRST on-disk impact.</desc>
