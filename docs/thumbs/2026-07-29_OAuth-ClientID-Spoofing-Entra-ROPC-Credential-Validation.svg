<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">OAuth client ID spoofing - Entra ID ROPC credential validation kill chain</title>
<desc id="d">Two lanes. Left: the victim tenant Entra ID token service processing a Resource Owner Password Credentials request that carries a spoofed client_id, returning AADSTS error codes (50034 no user, 50126 bad password, 700016 credential confirmed) and writing a sign-in log with a blank AppDisplayName, while app-scoped Conditional Access does not apply and smart lockout hits 28 percent of users. Right: the attacker validation harness acquiring credential lists and cloud infrastructure, forging spoofed client_id values, sending ROPC password grants, reading the AADSTS error oracle, fanning out across many fictional AppIds to evade per-app detection, and staging validated accounts. Detection anchors: AADSTS700016 on a blank AppDisplayName ROPC event, and many distinct AppIds from one source IP or user agent.</desc>
