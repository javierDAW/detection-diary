<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">Operation Dream Job: Lazarus AFD.sys zero-day kill chain</title>
<desc id="d">Two-lane diagram. Left lane, the victim Windows host: a Lazarus Dream Job recruiter lure and SEO-poisoned SecurityPDF site; user opens a malicious PDF or installs a trojanized viewer; DLL side-loading of libmupdf.dll shows a decoy and loads the in-memory MISTPEN downloader (Graph API and OneDrive, AES); the critical AFD.sys use-after-free CVE-2026-68820 elevates to SYSTEM; the critical FudModule 3.1 kernel rootkit kills the NT Kernel Logger, blinds 90-plus ETW providers and resets Smart App Control; MISTPEN is re-injected into a SYSTEM msiexec.exe and the Troy and ForestTiger backdoors collect and exfiltrate. Right lane, Lazarus infrastructure: Operation Dream Job social engineering, Enveil impersonation sites, OneDrive and Graph module staging, an ML-KEM post-quantum handshake protecting FudModule, hijacked Roundcube and WordPress relays running RelayShell via CVE-2025-49113, and ForestTiger and Troy C2 on 135.181.67.203 and 135.181.185.158. Detection anchors: the libmupdf.dll side-load, Graph beacons from non-browser processes, telemetry going dark, and SYSTEM msiexec anomalies.</desc>
