<text class="sub" x="42" y="920">Screenshot + clipboard plugin (in memory)</text>
<text class="sub" x="42" y="936">Email via curl (authenticate, select Inbox)</text>
<text class="sub" x="42" y="952">T1113 / T1115 / T1114.002</text>
<text class="mono" x="42" y="978">info.txt ; &lt;host&gt;.datb ; result.txt</text>

<rect class="stage" x="30" y="1020" width="395" height="135"/>
<circle class="badge" cx="50" cy="1040" r="14"/><text class="badgeText" x="50" y="1044">7</text>
