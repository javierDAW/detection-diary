<text class="sub" x="472" y="393">T1090 / T1571</text>
<text class="mono" x="472" y="420">auto.bat -&gt; service Cusrxsrv</text>

<rect class="op" x="460" y="465" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="485" r="14"/><text class="badgeText" x="480" y="489">C</text>
<text class="label" x="502" y="491">Plugin framework (in memory)</text>
<text class="sub" x="472" y="515">File Manager / Command Shell</text>
<text class="sub" x="472" y="531">Interaction Manager (screen, input)</text>
<text class="sub" x="472" y="547">exports ins_ctl_db + oct_lk_col</text>
<text class="sub" x="472" y="563">T1055 / T1620</text>
<text class="mono" x="472" y="590">cmd /S /C ... &gt; %TEMP%\tmp%d%x.tmp</text>

<rect class="op" x="460" y="635" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="655" r="14"/><text class="badgeText" x="480" y="659">D</text>
