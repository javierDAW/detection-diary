<!-- LEFT STAGES -->
<rect class="stage" x="30" y="120" width="395" height="135"/>
<circle class="badge" cx="50" cy="140" r="14"/><text class="badgeText" x="50" y="144">1</text>
<text class="label" x="72" y="146">Initial access (vector unknown)</text>
<text class="sub" x="42" y="170">Operator already holds admin credentials</text>
<text class="sub" x="42" y="186">Creates scheduled tasks on remote hosts</text>
<text class="sub" x="42" y="202">MITRE T1078 Valid Accounts</text>
<text class="mono" x="42" y="228">net use \\host\share  (admin creds)</text>

<rect class="stage" x="30" y="270" width="395" height="135"/>
<circle class="badge" cx="50" cy="290" r="14"/><text class="badgeText" x="50" y="294">2</text>
<text class="label" x="72" y="296">Task + service persistence</text>
<text class="sub" x="42" y="320">schtasks GoogleUpDate (SYSTEM, run-once)</text>
<text class="sub" x="42" y="336">1.bat -&gt; service NgcCIntSvc</text>
<text class="sub" x="42" y="352">T1053.005 / T1543.003 / T1036.005</text>
<text class="mono" x="42" y="378">oleasapi.dll  md5 082d49ef...5069</text>
<text class="mono" x="42" y="396">ServiceMain = RegisterService</text>

<rect class="stage" x="30" y="420" width="395" height="135"/>
<circle class="badge" cx="50" cy="440" r="14"/><text class="badgeText" x="50" y="444">3</text>
<text class="label" x="72" y="446">In-memory loader / evasion</text>
<text class="sub" x="42" y="470">Double-XOR + zlib; Key2 = C: drive serial</text>
<text class="sub" x="42" y="486">Reflective inject of backdoor DLL</text>
<text class="sub" x="42" y="502">T1027 / T1140 / T1620 / T1055</text>
<text class="mono" x="42" y="528">victim-keyed: inert off the target host</text>

<rect class="stage" x="30" y="570" width="395" height="135"/>
<circle class="badge" cx="50" cy="590" r="14"/><text class="badgeText" x="50" y="594">4</text>
<text class="label" x="72" y="596">Discovery / recon</text>
<text class="sub" x="42" y="620">in.bat: chcp 1256, wmic, wevtutil, reg</text>
<text class="sub" x="42" y="636">Fscan SSH 22 / MySQL 3306 (pp.txt)</text>
<text class="sub" x="42" y="652">T1082 / T1046 / T1110.001</text>
<text class="mono" x="42" y="678">fc.exe  md5 cf903e4a...6676</text>

<rect class="stageK" x="30" y="720" width="395" height="135"/>
<circle class="badgeK" cx="50" cy="740" r="14"/><text class="badgeText" x="50" y="744">5</text>
<text class="label" x="72" y="746">Credential access (critical)</text>
<text class="sub" x="42" y="770">Adobe.exe = Impacket secretsdump (DCSync)</text>
<text class="sub" x="42" y="786">64.exe browser decryptor; AnyDesk keylog</text>
<text class="sub" x="42" y="802">T1003.006 / T1555.003 / T1056.001</text>
<text class="mono" x="42" y="828">msect\dev0 keystrokes; dev1 clipboard</text>

<rect class="stage" x="30" y="870" width="395" height="135"/>
<circle class="badge" cx="50" cy="890" r="14"/><text class="badgeText" x="50" y="894">6</text>
