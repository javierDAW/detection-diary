<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">OctLurk and SilkLurk kill chain</title>
<desc id="d">Two lanes. Left: victim Windows host - initial access with valid admin credentials, GoogleUpDate scheduled task creating service NgcCIntSvc that loads oleasapi.dll, an in-memory loader keyed to the C drive serial, discovery with Fscan, credential access via Impacket secretsdump and a keylogger, collection, and staging and exfiltration. Right: attacker infrastructure - OctLurk raw TCP 443 C2 at multitoconference, LurkProxy on port 64980, the in-memory plugin framework, SilkLurk DLL side-loading with service RmSs, PlugX second stage via RasTls, and Chinese-speaking attribution overlapping SilentRaid MystRodX TrustFall. Detection anchors: task and service masquerade, ServiceMain equals RegisterService, and the raw-socket beacon on 443.</desc>
