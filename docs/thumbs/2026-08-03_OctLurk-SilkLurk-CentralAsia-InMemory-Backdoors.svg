<text class="sub" x="42" y="1086">net use to admin shares; out via LurkProxy</text>
<text class="sub" x="42" y="1102">T1560.001 / T1021.002 / T1090</text>
<text class="mono" x="42" y="1128">7z.exe md5 9a1dd1d9...1d06</text>

