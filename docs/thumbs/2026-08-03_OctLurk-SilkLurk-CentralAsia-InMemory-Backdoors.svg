<text class="sub" x="472" y="733">T1574.002 / T1543.003</text>
<text class="mono" x="472" y="760">config 2470b666bece868f (%APPDATA%)</text>

<rect class="op" x="460" y="805" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="825" r="14"/><text class="badgeText" x="480" y="829">E</text>
<text class="label" x="502" y="831">PlugX second stage</text>
<text class="sub" x="472" y="855">kmsonline.exe drops the RasTls set</text>
<text class="sub" x="472" y="871">RasTls.exe -&gt; RasTls.dll -&gt; .dll.res</text>
<text class="sub" x="472" y="887">Chinese-nexus staple backdoor</text>
<text class="sub" x="472" y="903">T1574.002</text>
<text class="mono" x="472" y="930">RasTls.dll md5 ef59aad6...ce69</text>

<rect class="op" x="460" y="975" width="395" height="155"/>
