<text class="footerH" x="34" y="1200">Durable detection anchors</text>
<text class="footerT" x="34" y="1222">1) GoogleUpDate/AnyDesk task masquerade  2) service ServiceMain = RegisterService (DLL outside System32)</text>
<text class="footerT" x="34" y="1240">3) raw TCP/443 beacon with no TLS ClientHello  4) DCSync (4662) from a non-DC  5) egress to port 64980</text>
