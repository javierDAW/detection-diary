<text class="sub" x="470" y="173">my-github.com (phishing, proxy, exfiltration)</text>
<text class="sub" x="470" y="189">my-gitlab.com (pivot, no confirmed link)</text>
<text class="sub" x="470" y="205">193.32.204.199 and noreply@my-github.com</text>
<text class="sub" x="470" y="221">No file hash published for the fake font</text>
<text class="mono" x="470" y="251">Source: THN 2026-10-19, OpenSourceMalware</text>
<text class="mono" x="470" y="269">iocs.csv 24 rows</text>
<rect class="op" x="460" y="295" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="315" r="14"/>
