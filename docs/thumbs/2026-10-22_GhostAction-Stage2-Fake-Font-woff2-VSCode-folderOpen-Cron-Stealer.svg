<text class="mono" x="470" y="609">Sources read as page summaries</text>
<rect class="op" x="460" y="635" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="655" r="14"/>
<text class="badgeText" x="480" y="660">D</text>
<text class="label" x="506" y="659">Scope as reported</text>
<text class="sub" x="470" y="683">94 repositories, 66 owners with stage 2</text>
<text class="sub" x="470" y="699">15 deleted, renamed or private; 79 accessible</text>
<text class="sub" x="470" y="715">65 of 79 without commits for over a year</text>
