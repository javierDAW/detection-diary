<rect class="footer" x="20" y="1175" width="840" height="95"/>
<text class="footerH" x="34" y="1198">Detection anchors: node on a font file, folderOpen task from git, crontab from node, look-alike domains</text>
<text class="footerT" x="34" y="1218">Rules in this folder: Sigma 01-05, KQL k1-k3, YARA 2 rules, Suricata sids 6380001-6380007, PEAK hunts H1-H3.</text>
<text class="footerT" x="34" y="1236">No hash, no CVE, no confirmed actor. Indicators are retrospective; counts and dates are as reported by researchers.</text>
<text class="footerT" x="34" y="1254">Act: revoke tokens from a clean device first, then clean repos; rotate secrets; keep VS Code Restricted Mode for untrusted code.</text>
