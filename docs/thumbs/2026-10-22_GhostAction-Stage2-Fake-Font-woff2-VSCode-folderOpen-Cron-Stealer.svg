<text class="mono" x="470" y="761">Counts from OpenSourceMalware via THN</text>
<text class="mono" x="470" y="779">Not independently reproduced</text>
<rect class="op" x="460" y="805" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="825" r="14"/>
<text class="badgeText" x="480" y="830">E</text>
<text class="label" x="506" y="829">Detection anchors in this folder</text>
<text class="sub" x="470" y="853">node reading a .woff2 file (Sigma 01-02, KQL k1)</text>
<text class="sub" x="470" y="869">tasks.json with folderOpen after git (KQL k2)</text>
<text class="sub" x="470" y="885">crontab started by node (Sigma 03)</text>
<text class="sub" x="470" y="901">Domains, IP, ports 8443 and 8080 (Suricata)</text>
<text class="mono" x="470" y="931">Sigma 01-05  KQL k1-k3  YARA 2 rules</text>
<text class="mono" x="470" y="949">Suricata sids 6380001-6380007</text>
<rect class="op" x="460" y="975" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="995" r="14"/>
<text class="badgeText" x="480" y="1000">F</text>
<text class="label" x="506" y="999">Attribution, conflicts and hardening</text>
<text class="sub" x="470" y="1023">Low confidence: Fake Font name overlap (DPRK lure)</text>
<text class="sub" x="470" y="1039">Port conflict: 8443 tokens versus 8080 stealer</text>
<text class="sub" x="470" y="1055">Revoke tokens first; keep workspace trust on</text>
<text class="sub" x="470" y="1071">Set task.allowAutomaticTasks off; audit npm bindings</text>
<text class="mono" x="470" y="1101">Related: SlugFest, npm trusted publishing</text>
<text class="mono" x="470" y="1119">GitHub changes dated 2026-10-02</text>

