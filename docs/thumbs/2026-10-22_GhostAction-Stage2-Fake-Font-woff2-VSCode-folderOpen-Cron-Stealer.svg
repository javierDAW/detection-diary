<text class="label" x="76" y="294">Reverse proxy captures password and 2FA code</text>
<text class="sub" x="40" y="318">Phishing kit sits between victim and GitHub</text>
<text class="sub" x="40" y="334">Session and one-time code harvested live</text>
<text class="sub" x="40" y="350">Victim sees a normal GitHub login</text>
<text class="mono" x="40" y="376">T1528</text>
<text class="mono" x="40" y="394">Hunt H3  account security log</text>
<rect class="stageK" x="30" y="420" width="395" height="135"/>
<circle class="badgeK" cx="50" cy="440" r="14"/>
<text class="badgeText" x="50" y="445">3</text>
<text class="label" x="76" y="444">OAuth device flow grant and stage 1 workflow</text>
<text class="sub" x="40" y="468">Injected JavaScript approves repo, workflow, read:org</text>
<text class="sub" x="40" y="484">Token sent to my-github.com on TCP/8443</text>
<text class="sub" x="40" y="500">Workflow sends secrets to 193.32.204.199</text>
