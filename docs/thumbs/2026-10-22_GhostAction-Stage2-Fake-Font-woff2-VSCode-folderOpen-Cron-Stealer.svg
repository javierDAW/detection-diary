<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">GhostAction stage 2 - fake font stealer, VS Code folderOpen task, cron persistence</title>
<desc id="d">Two-lane kill chain. Left lane: 1 phishing email from my-github.com, 2 reverse proxy captures password and 2FA, 3 OAuth device flow token and stage 1 workflow exfiltration to 193.32.204.199, 4 stage 2 files committed to 94 repositories, 5 developer opens the repository and VS Code runs node on a fake font, 6 cron every five minutes and plain HTTP exfiltration on TCP 8080, 7 credentials stolen. Right lane: indicators, OAuth abuse detail, stage 1 timeline, scope, detection anchors, attribution conflicts and hardening. Critical stages are the OAuth grant, the planted files and the workspace trust prompt.</desc>
