<text class="mono" x="40" y="544">Suricata 6380004-5  KQL k3</text>
<rect class="stageK" x="30" y="570" width="395" height="135"/>
<circle class="badgeK" cx="50" cy="590" r="14"/>
<text class="badgeText" x="50" y="595">4</text>
<text class="label" x="76" y="594">Stage 2: three files committed to 94 repositories</text>
<text class="sub" x="40" y="618">tasks.json (folderOpen), fake fa-solid-400.woff2,</text>
<text class="sub" x="40" y="634">second workflow (8 names, gist fallback)</text>
<text class="sub" x="40" y="650">66 owners; 65 of 79 live repos idle over a year</text>
<text class="mono" x="40" y="676">T1195.001  about 2026-10-15</text>
<text class="mono" x="40" y="694">Sigma 05  YARA 2 rules  Hunt H1 H2</text>
<rect class="stageK" x="30" y="720" width="395" height="135"/>
<circle class="badgeK" cx="50" cy="740" r="14"/>
<text class="badgeText" x="50" y="745">5</text>
<text class="label" x="76" y="744">Developer opens the repo and trusts the workspace</text>
<text class="sub" x="40" y="768">VS Code or Cursor runs the folderOpen task</text>
<text class="sub" x="40" y="784">node executes the .woff2 file as JavaScript</text>
<text class="sub" x="40" y="800">Restricted Mode would block the task</text>
<text class="mono" x="40" y="826">T1204.002  T1059.007  T1036.008</text>
<text class="mono" x="40" y="844">Sigma 01-02  KQL k1 k2</text>
