<text class="label" x="506" y="319">OAuth device flow abuse</text>
<text class="sub" x="470" y="343">Script loads /login/device and fills the user code</text>
<text class="sub" x="470" y="359">Adds authorize=1 and posts the approval</text>
<text class="sub" x="470" y="375">Scopes: repo, workflow, read:org</text>
<text class="sub" x="470" y="391">No consent screen shown to the victim</text>
<text class="mono" x="470" y="421">Detect: new OAuth grants in audit log</text>
<text class="mono" x="470" y="439">Hunt H3</text>
<rect class="op" x="460" y="465" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="485" r="14"/>
<text class="badgeText" x="480" y="490">C</text>
<text class="label" x="506" y="489">Stage 1 timeline (GitGuardian, OSM)</text>
<text class="sub" x="470" y="513">2026-10-08 to 09: spike, 28,000 repos in 20 minutes</text>
<text class="sub" x="470" y="529">2026-10-09: GitHub starts blocking the workflow</text>
<text class="sub" x="470" y="545">2026-10-10 and 12: waves extract no secrets</text>
<text class="sub" x="470" y="561">About 2026-10-15: stage 2 appears</text>
