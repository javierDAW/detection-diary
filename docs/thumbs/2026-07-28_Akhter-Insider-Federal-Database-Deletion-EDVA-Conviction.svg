<title id="t">Akhter insider federal-database-deletion kill chain</title>
<desc id="d">Two-lane diagram. Left lane: the DC-area federal contractor environment serving 45-plus agencies, its EEOC Public Portal plaintext-password store, case-management and FOIA databases, live credentials at termination, the roughly 96 deleted databases, event logs and the Teams termination-meeting recording. Right lane: the two insider operators query a plaintext password on 2026-02-01, reuse it to seize a complainant email, are fired on a remote meeting on 2026-02-18, log on post-termination without authorization, write-protect and delete about 96 databases, then destroy evidence. Detection anchors: post-termination authentication, mass DROP DATABASE bursts, plaintext credential retrieval and event-log clearing.</desc>
