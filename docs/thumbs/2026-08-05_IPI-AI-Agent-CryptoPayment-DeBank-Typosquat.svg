<text class="footerH" x="34" y="1200">Impact (Zscaler internal test across 26 LLMs)</text>
<text class="footerT" x="34" y="1220">Campaign 1 payment executed: Llama 3.3 70B, Llama 3.2 90B Vision, Gemini 3 Flash, Gemini 2.5 Pro (4/26).</text>
<text class="footerT" x="34" y="1238">Campaign 2 typosquat misclassified with minimal context: GPT-5.4 and Claude Sonnet 4.5 (2/26).</text>
