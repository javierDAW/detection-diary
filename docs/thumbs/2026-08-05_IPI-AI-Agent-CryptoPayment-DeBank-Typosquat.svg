<text class="sub" x="470" y="205">Open Graph and X cards mimic a real service</text>
<text class="sub" x="470" y="221">Ranks the malicious page for agents</text>
<text class="mono" x="470" y="248">lure: requests-secure-v2</text>
<text class="mono" x="470" y="266">staging infrastructure</text>

