<text class="sub" x="470" y="545">JSON-LD SoftwareApplication and offers</text>
<text class="sub" x="470" y="561">Machine-readable to scrapers and agents</text>
<text class="mono" x="470" y="588">left:-9999px; opacity:0</text>
<text class="mono" x="470" y="606">T1027 obfuscation</text>

