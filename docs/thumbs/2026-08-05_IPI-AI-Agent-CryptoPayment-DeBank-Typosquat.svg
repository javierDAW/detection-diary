<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">Indirect prompt injection against AI web agents kill chain</title>
<desc id="d">Two-lane diagram. Left lane, the AI agent journey: agent tasked to browse or code, selects an SEO-poisoned search result for the fake requests-secure-v2 library, fetches the page and its JSON-LD, ingests hidden CSS off-screen prompt-injection instructions, follows the injected order, campaign one sends about 0.0012 ETH to a hardcoded attacker wallet, campaign two poisons the agent context so it treats the debank.auction typosquat as authoritative. Right lane, attacker content and infrastructure: SEO poisoning with keyword-stuffed HTML, ten GitHub Open-Agent-Utilities repos linking eleven campaign sites, concealment via off-screen CSS and JSON-LD offers, the fake MissingLicenseKeyException license payload, a hardcoded Ethereum wallet, and DeBank typosquat trust props. Red anchors: hidden IPI ingested, agent follows the injection, crypto payment, and context poisoning.</desc>
