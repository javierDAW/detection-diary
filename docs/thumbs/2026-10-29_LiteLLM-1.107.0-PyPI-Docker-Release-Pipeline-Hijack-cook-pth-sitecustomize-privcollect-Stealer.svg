<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">LiteLLM 1.107.0 - hijacked release pipeline to startup-hook credential stealer</title>
<desc id="d">Two-lane kill chain. Left lane: 1 admin key leaked in a public repo, 2 GitHub CLI OAuth token theft via the Agent Platform API, 3 CI secrets exfiltrated to webhook.site, 4 release redirected to the Berri-AI lookalike fork with two tokens passing the gate, 5 poisoned litellm 1.107.0 wheels and images published, 6 cook.pth startup hook executes, 7 privcollect stealer exfiltrates to litellm.dev. Right lane: attribution, artifacts, stolen data, post-exploitation, pipeline lessons and response. Anchors: Sigma 01-06, KQL k1-k3, Suricata 9690001-5, hunts H1-H3.</desc>
