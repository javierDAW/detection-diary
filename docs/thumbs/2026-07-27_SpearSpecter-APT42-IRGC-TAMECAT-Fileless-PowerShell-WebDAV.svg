<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">SpearSpecter APT42 kill chain</title>
<desc id="d">Two-lane kill chain. Left lane: the victim Windows host from WhatsApp trust-building, a search-ms prompt and WebDAV LNK, a curl-delivered temp.bat loader, in-memory PowerShell modules, Renovation and UserInitMprLogonScript persistence, browser and Outlook collection, and chunked exfiltration. Right lane: APT42 cloud infrastructure - fake personas, Somee WebDAV delivery, Cloudflare Workers module hosts, Telegram and Discord command and control with an AES IV in a Sec-Host header, a Firebase heartbeat with an Azion edge front, and S3-compatible staging. Critical anchors are the davclnt.dll DavSetCookie WebDAV reach-out, the curl-rename-execute LNK, and the wildcard gcm i-star-x in-memory Invoke-Expression.</desc>
