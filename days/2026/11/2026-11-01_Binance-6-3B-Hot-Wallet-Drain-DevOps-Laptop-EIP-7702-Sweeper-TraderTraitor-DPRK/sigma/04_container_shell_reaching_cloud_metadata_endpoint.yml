title: Shell Or Network Utility Inside A Service Container Connects To The Cloud Instance Metadata Endpoint (Container Credential Theft Lead)
id: 70cce865-743f-46d5-85c1-756ef9387811
status: experimental
description: |
  Generic lead written for the 2026-10-29/30 Binance hot-wallet drain case, where a service container submitted unauthorized withdrawal
  transactions after a DevOps laptop compromise. Binance did not publish how signing authority or cloud credentials were obtained,
  so this rule does NOT detect that attack. It flags a shell or common network utility (curl, wget, nc, python) connecting to the
  link-local metadata endpoint 169.254.169.254 or the ECS task-credential endpoint 169.254.170.2, which is how an operator inside a
  container would lift the node or task role credentials. Scope it to container hosts; application SDKs that read metadata
  themselves are excluded by keying on shells and utilities. Confidence low.
references:
  - https://www.forbes.com/sites/digital-assets/2026/10/30/binances-63-billion-hack-started-with-one-engineers-laptop/
  - https://attack.mitre.org/techniques/T1552/005/
author: Jarmi
date: 2026/11/01
tags:
  - attack.credential-access
  - attack.t1552.005
logsource:
  category: network_connection
  product: linux
detection:
  selection_dest:
    DestinationIp:
      - '169.254.169.254'
      - '169.254.170.2'
  selection_image:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/ash'
      - '/busybox'
      - '/curl'
      - '/wget'
      - '/nc'
      - '/ncat'
      - '/python3'
  condition: selection_dest and selection_image
falsepositives:
  - Container entrypoint scripts that curl the metadata endpoint to discover region or instance id
  - Health-check or bootstrap scripts baked into the image

level: medium
