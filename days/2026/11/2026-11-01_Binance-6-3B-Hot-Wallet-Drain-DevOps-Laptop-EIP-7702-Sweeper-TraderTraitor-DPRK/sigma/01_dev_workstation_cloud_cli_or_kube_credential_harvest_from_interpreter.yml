title: Interpreter Or Temp-Path Process Harvests Cloud CLI Or Kubernetes Credentials On A Developer Workstation (DevOps Laptop Lead)
id: f7e2af70-cc57-4e1e-8f4d-4bb5caf9c8e4
status: experimental
description: |
  Behaviour lead inspired by the 2026-10-29/30 Binance hot-wallet drain (~USD 6.3B), where Binance's first finding was a compromised
  DevOps engineer's laptop that gave access to a service container able to submit withdrawal transactions. No IOC, malware name,
  tool name, credential type or laptop OS was published, so this rule does NOT detect that attack. It is generic: a script interpreter
  (node, python, ruby, perl, bash, sh, PowerShell) or a process running from a package cache or temp directory launches a cloud or
  Kubernetes CLI with a secret-export pattern (sts get-session-token, configure export-credentials, secretsmanager get-secret-value,
  gcloud auth print-access-token, kubectl get secret, kubectl config view --raw), or reads the local credential stores (.aws/credentials,
  .kube/config, gcloud credential db). Confidence low; tune on the population of DevOps and SRE workstations.
references:
  - https://www.forbes.com/sites/digital-assets/2026/10/30/binances-63-billion-hack-started-with-one-engineers-laptop/
  - https://hackread.com/binance-devops-engineer-hacked-laptop-billion-theft/
  - https://attack.mitre.org/techniques/T1552/001/
  - https://attack.mitre.org/techniques/T1528/
author: Jarmi
date: 2026/11/01
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.t1528
  - attack.execution
  - attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent_interpreter:
    ParentImage|endswith:
      - '/node'
      - '/python'
      - '/python3'
      - '/ruby'
      - '/perl'
      - '/bash'
      - '/sh'
      - '/pwsh'
  selection_parent_path:
    ParentImage|contains:
      - '/tmp/'
      - '/node_modules/'
      - '/.cache/'
      - '/site-packages/'
      - '/Downloads/'
  selection_cli_export:
    CommandLine|contains:
      - 'sts get-session-token'
      - 'configure export-credentials'
      - 'secretsmanager get-secret-value'
      - 'auth print-access-token'
      - 'get secret'
      - 'config view --raw'
  selection_cred_files:
    CommandLine|contains:
      - '/.aws/credentials'
      - '/.kube/config'
      - '/.config/gcloud/credentials.db'
      - '/.config/gcloud/access_tokens.db'
  condition: (selection_parent_interpreter or selection_parent_path) and (selection_cli_export or selection_cred_files)
falsepositives:
  - Developer tooling, Makefiles and shell wrappers that legitimately call aws, gcloud or kubectl to fetch short-lived tokens
  - IDE plugins and kubeconfig helpers that read ~/.kube/config through an interpreter
  - Credential-rotation scripts run by the platform team

level: medium
