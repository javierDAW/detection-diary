title: Interactive kubectl exec Or docker exec Into A Production Service Container From A Workstation-Class Parent (DevOps Laptop To Container Lead)
id: d57cc5c4-ee5b-435c-8b19-4a76c6c09693
status: experimental
description: |
  Behaviour lead inspired by the 2026-10-29/30 Binance hot-wallet drain, where Binance reported that a compromised DevOps laptop gave
  access to a service container that submitted unauthorized withdrawal transactions. How the container was reached was not published,
  so this rule does NOT detect that attack. It flags kubectl exec, kubectl debug, kubectl cp, kubectl port-forward or docker exec with an
  interactive shell, launched from a terminal, IDE or interpreter on a workstation, whose command line names a production namespace or
  context. Replace the namespace and context markers with your own naming. Confidence low; most value comes from scoping to the
  containers that can request or sign withdrawals.
references:
  - https://www.forbes.com/sites/digital-assets/2026/10/30/binances-63-billion-hack-started-with-one-engineers-laptop/
  - https://gizmodo.com/how-hackers-stole-6-3-billion-from-binance-in-minutes-2000833158
  - https://attack.mitre.org/techniques/T1609/
  - https://attack.mitre.org/techniques/T1021/
author: Jarmi
date: 2026/11/01
tags:
  - attack.execution
  - attack.t1609
  - attack.lateral-movement
  - attack.t1021
logsource:
  category: process_creation
  product: linux
detection:
  selection_kubectl:
    Image|endswith: '/kubectl'
    CommandLine|contains:
      - ' exec '
      - ' debug '
      - ' cp '
      - ' port-forward '
  selection_docker:
    Image|endswith: '/docker'
    CommandLine|contains: ' exec '
  selection_shell:
    CommandLine|contains:
      - '/bin/sh'
      - '/bin/bash'
      - ' sh'
      - ' bash'
      - ' -it '
      - ' -ti '
  selection_kubectl_transfer:
    CommandLine|contains:
      - ' cp '
      - ' port-forward '
  selection_prod_marker:
    CommandLine|contains:
      - 'prod'
      - 'wallet'
      - 'withdraw'
      - 'signer'
  selection_workstation_parent:
    ParentImage|endswith:
      - '/zsh'
      - '/bash'
      - '/fish'
      - '/code'
      - '/node'
      - '/python3'
      - '/iTerm2'
      - '/Terminal'
  condition: (selection_kubectl or selection_docker) and (selection_shell or selection_kubectl_transfer) and selection_prod_marker and selection_workstation_parent
falsepositives:
  - On-call SREs performing break-glass debugging under an approved change or incident ticket
  - Namespaces or contexts whose names contain prod or wallet but host non-sensitive workloads

level: medium
