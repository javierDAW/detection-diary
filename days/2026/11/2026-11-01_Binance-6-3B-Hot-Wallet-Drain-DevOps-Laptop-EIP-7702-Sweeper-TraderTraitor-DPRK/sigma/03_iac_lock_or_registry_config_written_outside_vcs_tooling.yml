title: Terraform Lock File Or Provider Registry Configuration Written By A Non-VCS, Non-Terraform Process (IaC Tampering Lead)
id: 0a5ca1c7-10b6-4bdf-bffa-1bec44a51f05
status: experimental
description: |
  Generic IaC-tampering lead written for the 2026-10-29/30 Binance hot-wallet drain case. One vendor blog speculated about malicious
  Terraform lock files or registries; that claim is UNCORROBORATED and speculative, and Binance did not publish the initial access
  vector beyond a compromised DevOps laptop. This rule does NOT detect that attack. It flags writes to .terraform.lock.hcl, .terraformrc,
  terraform.rc or a provider_installation / network-mirror config by a process that is not terraform, tofu, git or a known editor,
  because a provider hash or mirror swap lets a later terraform init pull attacker-controlled provider code with the engineer's cloud
  credentials. Confidence low.
references:
  - https://hackread.com/binance-devops-engineer-hacked-laptop-billion-theft/
  - https://attack.mitre.org/techniques/T1195/001/
  - https://attack.mitre.org/techniques/T1554/
author: Jarmi
date: 2026/11/01
tags:
  - attack.initial-access
  - attack.t1195.001
  - attack.persistence
  - attack.t1554
logsource:
  category: file_event
  product: linux
detection:
  selection_target:
    TargetFilename|endswith:
      - '/.terraform.lock.hcl'
      - '/.terraformrc'
      - '/terraform.rc'
  filter_expected_writer:
    Image|endswith:
      - '/terraform'
      - '/tofu'
      - '/git'
      - '/vim'
      - '/nvim'
      - '/nano'
      - '/code'
      - '/idea'
      - '/terragrunt'
  condition: selection_target and not filter_expected_writer
falsepositives:
  - Dependency bots, pre-commit hooks or CI wrappers that regenerate lock files through a different binary
  - Editors not listed in the filter; add them after baselining

level: medium
