<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1080" role="img" aria-labelledby="t d">
  <title id="t">FAA nationwide ground stop fault chain</title>
  <desc id="d">Single-lane fault chain reconstructed from reported statements: legacy FTI backbone, a patch or update, router overload and reboot (critical), voice and screen degradation at all ARTCCs, nationwide safety ground stop (critical) and the triage of fault versus attack. Detection anchors are reload and restart syslog, config change before reload, and telemetry silence. No adversary or IOC is confirmed.</desc>
<defs>
<style><![CDATA[
.bg { fill: #ffffff; }
.head { font: 700 18px sans-serif; fill: #0a0a0a; }
.meta { font: 11px sans-serif; fill: #404040; }
.laneL { fill: #f3f7fb; stroke: #5a7da6; stroke-width: 1.2; }
.laneR { fill: #faf3ee; stroke: #b07a3a; stroke-width: 1.2; }
.laneLabelL { font: 700 12px sans-serif; fill: #2a4a6a; }
.laneLabelR { font: 700 12px sans-serif; fill: #8a5520; }
.stage { fill: #ffffff; stroke: #5a7da6; stroke-width: 1.1; }
.stageK { fill: #fdecec; stroke: #b03030; stroke-width: 1.4; }
.op { fill: #ffffff; stroke: #b07a3a; stroke-width: 1.1; }
.opK { fill: #fdecec; stroke: #b03030; stroke-width: 1.4; }
.band { fill: #f7f1eb; stroke: #c08555; stroke-width: 1.2; }
.badge { fill: #5a7da6; }
.badgeK { fill: #b03030; }
.badgeR { fill: #b07a3a; }
.badgeText { font: 700 12px sans-serif; fill: #ffffff; text-anchor: middle; }
.label { font: 700 13px sans-serif; fill: #0a0a0a; }
.sub { font: 11px sans-serif; fill: #303030; }
.mono { font: 10.5px ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #303030; }
.footer { fill: #f6f6f4; stroke: #888; stroke-width: 1; }
.footerH { font: 700 12px sans-serif; fill: #1a1a1a; }
.footerT { font: 10.5px sans-serif; fill: #1a1a1a; }
.arrow { stroke: #2a4a6a; stroke-width: 1.6; fill: none; }
.arrowX { stroke: #7a3a7a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; }
.arrowR { stroke: #8a5520; stroke-width: 1.6; fill: none; }

/* per-theme accent - header bar / pill only; lanes & stages stay frozen */
.acc-ransomware { fill: #b03030; }
.acc-espionage { fill: #2a4a6a; }
.acc-supply-chain { fill: #b07a3a; }
.acc-identity-cloud { fill: #6a4ca6; }
.acc-ot-ics { fill: #2f8f4e; }
.acc-edge-network { fill: #1d7a8c; }
.acc-mobile { fill: #c2569a; }
.acc-crypto-defi { fill: #d08a1f; }
.acc-malware-re { fill: #556070; }
.acc-other { fill: #6a6a6a; }
.accLabel { font: 700 11px sans-serif; fill: #ffffff; }

@media (prefers-color-scheme: dark) {
  .bg { fill: #0d1117; }
  .head, .label, .footerH { fill: #f0f0f0; }
  .meta, .sub, .footerT { fill: #c8c8c8; }
  .mono { fill: #c0d0e0; }
  .laneL { fill: #182230; stroke: #7aa6d0; }
  .laneR { fill: #2a2418; stroke: #d09a5a; }
  .laneLabelL { fill: #a8c6e2; }
  .laneLabelR { fill: #e2bf8a; }
  .stage { fill: #1c2530; stroke: #7aa6d0; }
  .stageK { fill: #3a1818; stroke: #e06060; }
  .op { fill: #2a2418; stroke: #d09a5a; }
  .opK { fill: #3a1818; stroke: #e06060; }
  .band { fill: #2a2418; stroke: #d09a5a; }
  .badge { fill: #7aa6d0; }
  .badgeK { fill: #e06060; }
  .badgeR { fill: #d09a5a; }
  .badgeText { fill: #0d1117; }
  .footer { fill: #1a1d22; stroke: #555; }
  .arrow { stroke: #a8c6e2; }
  .arrowX { stroke: #c898d0; }
  .arrowR { stroke: #e2bf8a; }
}
]]></style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
</marker>
</defs>
  <rect class="bg" x="0" y="0" width="880" height="1080"/>
  <rect class="acc-other" x="0" y="0" width="880" height="8"/>
  <text class="head" x="20" y="36">FAA nationwide ground stop - fault chain, no confirmed attacker</text>
  <text class="meta" x="20" y="58">Source: CBS, SecurityWeek, CNBC (2026-11-13/14) - Date: 2026-11-15 - Cluster: none - Day 145</text>
  <rect class="laneL" x="20" y="85" width="840" height="890" rx="8"/>
  <rect class="stage" x="30" y="100" width="820" height="130" rx="6"/>
  <circle class="badge" cx="50" cy="120" r="14"/>
  <text class="badgeText" x="50" y="125">1</text>
  <text class="label" x="75" y="124">Legacy dependency (reported)</text>
  <text class="sub" x="45" y="148">FTI backbone links ARTCCs and FAA facilities (CBS)</text>
  <text class="sub" x="45" y="164">2023 FAA-commissioned review: obsolete, TDM-dependent</text>
  <text class="sub" x="45" y="180">Operated by L3Harris; Harris contract awarded 2002</text>
  <text class="mono" x="45" y="206">Detect: inventory EoL routers (H1)</text>
  <text class="mono" x="45" y="224">No logs or firmware detail published</text>
  <line class="arrow" x1="440" y1="230" x2="440" y2="245" marker-end="url(#ah)"/>
  <rect class="stage" x="30" y="245" width="820" height="130" rx="6"/>
  <circle class="badge" cx="50" cy="265" r="14"/>
  <text class="badgeText" x="50" y="270">2</text>
  <text class="label" x="75" y="269">Change introduced (reported)</text>
  <text class="sub" x="45" y="293">Patches / new equipment (Mullin); contractor upgrade (Duffy)</text>
  <text class="sub" x="45" y="309">Private network update caused reboot and crash (CBS sources)</text>
  <text class="sub" x="45" y="325">Accounts overlap; no change record published</text>
  <text class="mono" x="45" y="351">Detect: config change then reload (k2, Sigma 02)</text>
  <text class="mono" x="45" y="369">Detect: sid 9026650003</text>
  <line class="arrow" x1="440" y1="375" x2="440" y2="390" marker-end="url(#ah)"/>
  <rect class="stageK" x="30" y="390" width="820" height="130" rx="6"/>
  <circle class="badgeK" cx="50" cy="410" r="14"/>
  <text class="badgeText" x="50" y="415">3</text>
  <text class="label" x="75" y="414">Overload and reboot (reported)</text>
  <text class="sub" x="45" y="438">Routers flooded with data, inconsistent info (Duffy)</text>
  <text class="sub" x="45" y="454">Cisco 600 series 2001-2006 isolated (senior sources, unconfirmed)</text>
  <text class="sub" x="45" y="470">Out-of-sync packets reach ATC systems</text>
  <text class="mono" x="45" y="496">Detect: %SYS-5-RELOAD, MALLOCFAIL, CPUHOG</text>
  <text class="mono" x="45" y="514">Rules: Sigma 01/03, sid 9026650001/2</text>
  <line class="arrow" x1="440" y1="520" x2="440" y2="535" marker-end="url(#ah)"/>
  <rect class="stage" x="30" y="535" width="820" height="130" rx="6"/>
  <circle class="badge" cx="50" cy="555" r="14"/>
  <text class="badgeText" x="50" y="560">4</text>
  <text class="label" x="75" y="559">Service degradation</text>
  <text class="sub" x="45" y="583">Static on voice lines; screens flash or go black (CBS)</text>
  <text class="sub" x="45" y="599">Communication problem at all ARTCCs (Duffy post)</text>
  <text class="sub" x="45" y="615">Controllers union: some plane comms disrupted (headline)</text>
  <text class="mono" x="45" y="641">Detect: telemetry silence (k3, H3)</text>
  <text class="mono" x="45" y="659">Correlate with service-owner reports</text>
  <line class="arrow" x1="440" y1="665" x2="440" y2="680" marker-end="url(#ah)"/>
  <rect class="stageK" x="30" y="680" width="820" height="130" rx="6"/>
  <circle class="badgeK" cx="50" cy="700" r="14"/>
  <text class="badgeText" x="50" y="705">5</text>
  <text class="label" x="75" y="704">Safety shutdown</text>
  <text class="sub" x="45" y="728">Chicago halted first, then nationwide ground stop</text>
  <text class="sub" x="45" y="744">Lifted about 8:15 pm ET on 2026-11-13</text>
  <text class="sub" x="45" y="760">9,159 cancellations Friday (FlightAware via CBS)</text>
  <text class="mono" x="45" y="786">Impact: availability, not data theft</text>
  <text class="mono" x="45" y="804">No malware or CVE reported</text>
  <line class="arrow" x1="440" y1="810" x2="440" y2="825" marker-end="url(#ah)"/>
  <rect class="stage" x="30" y="825" width="820" height="130" rx="6"/>
  <circle class="badge" cx="50" cy="845" r="14"/>
  <text class="badgeText" x="50" y="850">6</text>
  <text class="label" x="75" y="849">Triage: fault or attack?</text>
  <text class="sub" x="45" y="873">Mullin: appeared mechanical, no footprints, not ruled out</text>
  <text class="sub" x="45" y="889">FBI reportedly probing a software update (Bloomberg)</text>
  <text class="sub" x="45" y="905">NSA, DoD, CISA involved per Mullin; root cause open</text>
  <text class="mono" x="45" y="931">Decide with evidence: peak_h2 triage table</text>
  <text class="mono" x="45" y="949">Preserve crashinfo before more reloads</text>
  <rect class="footer" x="20" y="985" width="840" height="85" rx="6"/>
  <text class="footerH" x="35" y="1008">Detection anchors (generic hints, confidence LOW)</text>
  <text class="footerT" x="35" y="1028">Reload/restart syslog (Sigma 01, sid 9026650001) - config change then reload within 60 min (k2) - telemetry silence (k3)</text>
  <text class="footerT" x="35" y="1046">Root cause NOT confirmed. Router model and trigger rest on unnamed or conflicting sources. No IOCs published.</text>
</svg>
