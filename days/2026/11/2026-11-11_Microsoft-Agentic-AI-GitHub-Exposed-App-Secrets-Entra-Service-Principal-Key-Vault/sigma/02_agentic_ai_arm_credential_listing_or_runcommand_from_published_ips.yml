title: Agentic AI Secret Abuse - Azure Credential-Returning Operation Or VM Run Command From Published Campaign IPs
id: 4a06098a-075c-49e0-8143-93425204a0dc
status: experimental
description: |
  Detects Azure Resource Manager operations that return secrets (storage account keys, App Service
  publishing credentials and settings, connection strings, AKS cluster user credentials, generic
  listKeys / listCredentials actions) or a VM Run Command action, issued from the IP addresses published by
  Microsoft Threat Intelligence on 2026-11-05. After signing in as a service principal with an
  application secret leaked on GitHub, the agentic AI framework called ARM to harvest storage keys,
  App Service settings, connection strings, publishing credentials, AI/ML connections and datastores and
  AKS user credentials, and used a compromised OAuth app with Azure VM Run Command.
  Two selections are combined: the operation (selection_cred_ops) AND the source IP (selection_ips).
  The same operations from any non-baselined service principal are hunted without the IP filter in
  kql/k2, where a per-identity baseline and the "400 then 200 with corrected api-version" retry
  fingerprint can be applied; that correlation and any volume threshold belong in SIEM aggregation,
  not in this static rule.
  Field names follow SigmaHQ azure activitylogs conventions (operationName, callerIpAddress). Note that
  Azure Activity Log records only control-plane writes and POST actions; list* actions ARE POST actions
  and are logged, while plain GET reads (for example SQL firewall rule GETs) are generally not.
  Honesty: IPs are published by Microsoft but may be rotated or reassigned; 199.19.77.18 is a Tor exit;
  65.87.223.26 and 157.22.126.128 are only "may be linked". The operation list is generic Azure
  knowledge chosen to match the resource types Microsoft named, not request shapes published by Microsoft.
  Not tested.
references:
  - https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/
author: Jarmi
date: 2026/11/11
tags:
  - attack.credential-access
  - attack.t1552
  - attack.t1555.006
  - attack.execution
  - attack.t1651
  - attack.discovery
  - attack.t1580
logsource:
  product: azure
  service: activitylogs
detection:
  selection_cred_ops:
    operationName|contains:
      - '/LISTKEYS/ACTION'
      - '/LISTCREDENTIALS/ACTION'
      - '/LISTCLUSTERUSERCREDENTIAL/ACTION'
      - '/LISTCLUSTERADMINCREDENTIAL/ACTION'
      - '/PUBLISHXML/ACTION'
      - '/CONFIG/LIST/ACTION'
      - '/LISTSECRETS/ACTION'
      - '/LISTCONNECTIONSTRINGS/ACTION'
      - '/LISTPUBLISHINGCREDENTIALS/ACTION'
      - '/RUNCOMMAND/ACTION'
  selection_ips:
    callerIpAddress:
      - '199.19.77.84'
      - '199.19.77.18'
      - '65.87.223.26'
      - '157.22.126.128'
  condition: selection_cred_ops and selection_ips
falsepositives:
  - Reassignment of these addresses after publication (re-validate before treating a hit as live).
  - Legitimate automation routed through Tor (very unusual for ARM management traffic).

level: critical
