title: Entra ID Sign-In Failure With Invalid Or Expired Client Secret (AADSTS7000215 / AADSTS7000222)
id: d4cc0f95-ec49-4b93-965b-c1281be634dd
status: experimental
description: |
  Detects Microsoft Entra ID sign-ins that fail with error 7000215 (invalid client secret provided) or
  7000222 (the provided client secret keys are expired). Microsoft Threat Intelligence (2026-11-05) notes
  that these failures from an IP address mean that someone holds a credential for the application - for
  example an old or rotated secret that was leaked on GitHub and is now being tried by an agentic AI
  framework. A failure followed by a success for the same application from the same IP is urgent.
  This atomic rule fires on the failure only. The higher-fidelity correlations Microsoft describes must be
  built as SIEM aggregations (see kql/k1):
    - failure (7000215/7000222) followed by success (ResultType 0) for the same AppId from the same IP
      within 24 hours;
    - one IP authenticating to 3 or more distinct service principals within 1 hour with mixed success
      and failure;
    - repeated failures for one AppId from IPs outside the application's baseline.
  Service principal sign-ins live in a separate Entra log category (ServicePrincipalSignInLogs /
  AADServicePrincipalSignInLogs); make sure your backend mapping includes it.
  Honesty: generic heuristic built from Microsoft guidance; it is not specific to this actor and will also
  fire on misconfigured pipelines still using a rotated secret. Not tested.
references:
  - https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/
  - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
author: Jarmi
date: 2026/11/11
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.initial-access
  - attack.t1078.004
logsource:
  product: azure
  service: signinlogs
detection:
  selection_invalid_secret:
    ResultType: '7000215'
  selection_expired_secret:
    ResultType: '7000222'
  condition: selection_invalid_secret or selection_expired_secret
falsepositives:
  - CI/CD pipelines, scheduled scripts or containers still configured with a rotated or expired secret (typically a stable, known source IP inside your egress ranges; baseline it).
  - Developers testing an app registration with a mistyped secret.

level: medium
