title: TAMECAT Registry Persistence - Renovation Run Key and UserInitMprLogonScript (SpearSpecter)
id: 3237b087-60de-44a6-8fbe-0185c0fd47e0
status: experimental
description: >
  Detects the two TAMECAT (SpearSpecter / APT42) persistence mechanisms via registry writes: a per-user Run
  value named 'Renovation' that launches every file in the Internet Explorer List folder, and a
  UserInitMprLogonScript value pointing to a conhost --headless batch (Microsoft.bat) used as a Firebase
  heartbeat. Either write on a workstation is high-signal. Three registry sources map to distinct atomic
  detections; this rule covers the Run value and the logon-script value in one registry_set logsource.
references:
    - https://govextra.gov.il/national-digital-agency/cyber/research/spearspecter/
    - https://securityonline.info/iran-apt-spearspecter-uses-weeks-long-whatsapp-lures-and-fileless-tamecat-backdoor-to-hit-defense/
author: Jarmi
date: 2026/07/27
tags:
    - attack.persistence
    - attack.t1547.001
    - attack.t1037.001
logsource:
    category: registry_set
    product: windows
detection:
    selection_run:
        TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Run\Renovation'
    selection_logonscript:
        TargetObject|endswith: '\Environment\UserInitMprLogonScript'
    selection_logonscript_val:
        Details|contains: 'conhost'
    condition: selection_run or (selection_logonscript and selection_logonscript_val)
falsepositives:
    - Legitimate logon scripts set via UserInitMprLogonScript by administrators (verify the target binary)

level: high
