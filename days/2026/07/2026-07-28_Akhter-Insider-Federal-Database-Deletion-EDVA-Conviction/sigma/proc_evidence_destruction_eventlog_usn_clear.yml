title: Windows Event Log or USN Journal Cleared via Command Line
id: 301d2963-c085-434f-8e63-dfee141fdd9f
status: experimental
description: >
  Detects command-line clearing of Windows event logs (wevtutil cl / Clear-EventLog /
  Remove-EventLog) or deletion of the NTFS USN change journal (fsutil usn deletejournal).
  In the 2026 Akhter EDVA insider case the just-terminated operators destroyed evidence of
  their activity immediately after mass database deletion; this rule anchors that
  anti-forensics step. Not sample-specific -- durable behavioral pattern.
references:
  - https://www.justice.gov/opa/pr/federal-jury-convicts-virgina-man-charges-relating-deletion-us-government-databases
  - https://attack.mitre.org/techniques/T1070/001/
author: Jarmi
date: 2026/07/28
tags:
  - attack.defense-evasion
  - attack.t1070.001
  - attack.t1070.009
logsource:
  category: process_creation
  product: windows
detection:
  selection_wevtutil:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  selection_ps:
    CommandLine|contains:
      - 'Clear-EventLog'
      - 'Remove-EventLog'
      - 'Limit-EventLog'
  selection_usn:
    Image|endswith: '\fsutil.exe'
    CommandLine|contains|all:
      - 'usn'
      - 'deletejournal'
  condition: selection_wevtutil or selection_ps or selection_usn
falsepositives:
  - Legitimate administrative log rotation or diagnostic clearing; correlate with change tickets and off-hours or terminated-account context.

level: high
