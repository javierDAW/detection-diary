<text class="meta" x="20" y="58">Vendor: Jamf Threat Labs · Date: 2026-07-13/14 · Cluster: unattributed · Day 89</text>

<rect class="laneL" x="20" y="85" width="410" height="1080"/>
<rect class="laneR" x="450" y="85" width="410" height="1080"/>
<text class="laneLabelL" x="35" y="105">Victim Mac — execution timeline</text>
<text class="laneLabelR" x="465" y="105">Attacker infrastructure</text>

<!-- Left stage 1 -->
<rect class="stage" x="30" y="120" width="395" height="135"/>
<circle class="badge" cx="50" cy="140" r="14"/>
<text class="badgeText" x="50" y="144">1</text>
<text class="label" x="74" y="144">Delivery: PIN-gated dropper</text>
<text class="sub" x="40" y="168">PIN-gated download from werkbit.io</text>
<text class="sub" x="40" y="184">Signed disk image plus notarized Werkbit.app</text>
<text class="sub" x="40" y="200">Domain registered late June 2026</text>
<text class="mono" x="40" y="226">werkbit[.]io</text>
<text class="mono" x="40" y="244">Dev ID: Emil Grigorov (WWB7JA7AQV)</text>

<!-- Left stage 2 -->
<rect class="stage" x="30" y="270" width="395" height="135"/>
<circle class="badge" cx="50" cy="290" r="14"/>
<text class="badgeText" x="50" y="294">2</text>
<text class="label" x="74" y="294">Execution: Gatekeeper clears app</text>
<text class="sub" x="40" y="318">veltod binary launches with no warning</text>
<text class="sub" x="40" y="334">Notarization ticket stapled to the app</text>
<text class="sub" x="40" y="350">Masquerades as meeting/collab software</text>
<text class="mono" x="40" y="376">Werkbit.app/Contents/MacOS/veltod</text>
<text class="mono" x="40" y="394">spctl assessment: accepted</text>

<!-- Left stage 3 -->
<rect class="stage" x="30" y="420" width="395" height="135"/>
<circle class="badge" cx="50" cy="440" r="14"/>
<text class="badgeText" x="50" y="444">3</text>
<text class="label" x="74" y="444">Staging fetch via GitHub and curl</text>
<text class="sub" x="40" y="468">sys.cache from mgothiclove/pkeys repo</text>
<text class="sub" x="40" y="484">Base64 blobs decoded at runtime, piped to bash</text>
<text class="sub" x="40" y="500">Cleartext HTTP fetch of the payload image</text>
<text class="mono" x="40" y="526">github.com/mgothiclove/pkeys</text>
<text class="mono" x="40" y="544">/d/f1b24e/download -&gt; CrashReporter.dmg</text>

<!-- Left stage 4 -->
<rect class="stage" x="30" y="570" width="395" height="135"/>
<circle class="badge" cx="50" cy="590" r="14"/>
<text class="badgeText" x="50" y="594">4</text>
<text class="label" x="74" y="594">Payload deploy: hidden tmp path</text>
<text class="sub" x="40" y="618">hdiutil mounts -nobrowse -noverify -quiet</text>
<text class="sub" x="40" y="634">App copied into a hidden dot-directory</text>
<text class="sub" x="40" y="650">Signature stripped, re-signed ad hoc, launched</text>
<text class="mono" x="40" y="676">/private/tmp/.CrashReporter/</text>
<text class="mono" x="40" y="694">Bundle ID: com.apple.crashreporter</text>

<!-- Left stage 5 (critical) -->
<rect class="stageK" x="30" y="720" width="395" height="135"/>
<circle class="badgeK" cx="50" cy="740" r="14"/>
<text class="badgeText" x="50" y="744">5</text>
<text class="label" x="74" y="744">Credential capture: fake prompt</text>
<text class="sub" x="40" y="768">Native-looking dialog validated via dscl</text>
<text class="sub" x="40" y="784">Loops until the correct password is entered</text>
<text class="sub" x="40" y="800">Unlocks the login Keychain via security cli</text>
<text class="mono" x="40" y="826">~/.cache/.sys_auth (mode 600)</text>
<text class="mono" x="40" y="844">dscl . -authonly &lt;user&gt; &lt;password&gt;</text>

<!-- Left stage 6 -->
<rect class="stage" x="30" y="870" width="395" height="135"/>
<circle class="badge" cx="50" cy="890" r="14"/>
<text class="badgeText" x="50" y="894">6</text>
<text class="label" x="74" y="894">Collection: browsers, wallets, files</text>
<text class="sub" x="40" y="918">Nine Chromium and Firefox browsers targeted</text>
<text class="sub" x="40" y="934">About 80 wallet extensions, 14 password managers</text>
<text class="sub" x="40" y="950">Documents and Downloads file search</text>
<text class="mono" x="40" y="976">MetaMask, Phantom, 1Password, Bitwarden</text>
<text class="mono" x="40" y="994">AES-256-GCM via CommonCrypto</text>

<!-- Left stage 7 (critical) -->
<rect class="stageK" x="30" y="1020" width="395" height="135"/>
<circle class="badgeK" cx="50" cy="1040" r="14"/>
<text class="badgeText" x="50" y="1044">7</text>
<text class="label" x="74" y="1044">Persistence: impersonating LaunchAgent</text>
<text class="sub" x="40" y="1068">Copies itself to a Library/Caches path</text>
<text class="sub" x="40" y="1084">Re-signed ad hoc a second time</text>
<text class="sub" x="40" y="1100">KeepAlive relaunches it on failed exit</text>
<text class="mono" x="40" y="1126">com.apple.crashreporter.helper.plist</text>
<text class="mono" x="40" y="1144">Label: com.apple.crashreporter.helper</text>

<!-- Right op 1 -->
<rect class="op" x="460" y="125" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="145" r="14"/>
<text class="badgeText" x="480" y="149">A</text>
<text class="label" x="504" y="149">Signing identity and delivery site</text>
<text class="sub" x="470" y="173">Apple Developer ID, valid and notarized</text>
<text class="sub" x="470" y="189">Disk image itself is signed, not just the app</text>
<text class="sub" x="470" y="205">werkbit.io registered late June 2026</text>
<text class="sub" x="470" y="221">Download gated behind a meeting PIN</text>
<text class="mono" x="470" y="251">Emil Grigorov (WWB7JA7AQV)</text>
<text class="mono" x="470" y="269">werkbit[.]io</text>

<!-- Right op 2 -->
<rect class="op" x="460" y="295" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="315" r="14"/>
<text class="badgeText" x="480" y="319">B</text>
<text class="label" x="504" y="319">GitHub staging pointer</text>
<text class="sub" x="470" y="343">Repo hosts sys.cache, a config pointer</text>
<text class="sub" x="470" y="359">Not the payload itself, a dead-drop resolver</text>
<text class="sub" x="470" y="375">curl command embedded inside the file</text>
<text class="sub" x="470" y="391">API-based fetch blends with dev traffic</text>
<text class="mono" x="470" y="421">github.com/mgothiclove/pkeys</text>
<text class="mono" x="470" y="439">sys.cache</text>

<!-- Right op 3 -->
<rect class="op" x="460" y="465" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="485" r="14"/>
<text class="badgeText" x="480" y="489">C</text>
<text class="label" x="504" y="489">Payload host (cleartext HTTP)</text>
<text class="sub" x="470" y="513">Serves CrashReporter.dmg over plain HTTP</text>
<text class="sub" x="470" y="529">Retries the download up to three times</text>
<text class="sub" x="470" y="545">Also hosts the operator login panel</text>
<text class="sub" x="470" y="561">Dark-themed "Command Panel" interface</text>
<text class="mono" x="470" y="591">endpoint-api-v1[.]com</text>
<text class="mono" x="470" y="609">/login</text>

<!-- Right op 4 (critical) -->
<rect class="opK" x="460" y="635" width="395" height="155"/>
<circle class="badgeK" cx="480" cy="655" r="14"/>
<text class="badgeText" x="480" y="659">D</text>
<text class="label" x="504" y="659">Command and control</text>
<text class="sub" x="470" y="683">IP hardcoded as an ATS exception</text>
<text class="sub" x="470" y="699">Present in earlier builds only</text>
<text class="sub" x="470" y="715">Later builds use a proper TLS endpoint</text>
<text class="sub" x="470" y="731">Panel spotted independently by MalwareHunterTeam</text>
<text class="mono" x="470" y="761">179.43.166.242</text>
<text class="mono" x="470" y="779">ATS exception in Info.plist</text>

<!-- Right op 5 -->
<rect class="op" x="460" y="805" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="825" r="14"/>
<text class="badgeText" x="480" y="829">E</text>
<text class="label" x="504" y="829">Client-side encryption and exfil</text>
<text class="sub" x="470" y="853">AES-256-GCM applied per collected item</text>
<text class="sub" x="470" y="869">PBKDF2-HMAC-SHA256, 10000 iterations</text>
<text class="sub" x="470" y="885">Hardcoded salt panel_salt_v1</text>
<text class="sub" x="470" y="901">Exfiltration over libcurl to the C2</text>
<text class="mono" x="470" y="931">.zx_ + 8 hex chars.zip</text>
<text class="mono" x="470" y="949">panel_salt_v1</text>

<!-- Right op 6 -->
<rect class="op" x="460" y="975" width="395" height="155"/>
<circle class="badgeR" cx="480" cy="995" r="14"/>
<text class="badgeText" x="480" y="999">F</text>
<text class="label" x="504" y="999">Shared backend infrastructure</text>
<text class="sub" x="470" y="1023">Related operator domains observed</text>
<text class="sub" x="470" y="1039">Points to a larger multi-platform campaign</text>
<text class="sub" x="470" y="1055">Jamf reported the Team ID to Apple</text>
<text class="sub" x="470" y="1071">Not yet publicly attributed to a named group</text>
<text class="mono" x="470" y="1101">cohezo[.]io / cohezo[.]com</text>
<text class="mono" x="470" y="1119">cordinex[.]io</text>

