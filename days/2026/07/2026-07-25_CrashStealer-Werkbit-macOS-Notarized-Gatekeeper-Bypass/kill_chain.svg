<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">CrashStealer macOS kill chain — notarized dropper to Keychain and wallet theft</title>
<desc id="d">Two-lane kill chain for the CrashStealer macOS infostealer. Left lane shows seven victim-Mac stages: a PIN-gated notarized "Werkbit Setup" dropper clearing Gatekeeper, execution of the veltod binary, a GitHub-hosted staging fetch and cleartext HTTP payload download, deployment of a re-signed payload from a hidden /private/tmp path, a fake password prompt validated via dscl -authonly that unlocks the login Keychain, bulk collection of browsers/wallets/password managers/files, and persistence via a LaunchAgent impersonating Apple's crash-reporter naming. Right lane shows six infrastructure boxes: the notarized signing identity and delivery site, the GitHub dead-drop resolver, the cleartext payload host and operator panel, the hardcoded command-and-control IP, the client-side AES-256-GCM encryption and libcurl exfiltration, and shared backend domains tying the operation to a larger multi-platform campaign. Critical badges flag the credential-capture stage, the persistence stage, and the command-and-control infrastructure box.</desc>
<defs>
