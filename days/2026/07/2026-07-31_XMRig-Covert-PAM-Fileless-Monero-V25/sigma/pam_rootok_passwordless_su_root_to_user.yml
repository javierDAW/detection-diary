title: Root-Initiated Password-less su to Low-Privileged User (pam_rootok Smokescreen)
id: 01bedecc-7004-4f0d-bb1c-feae0bd80cc6
status: experimental
description: >
  Detects a root process invoking su to switch into a (non-root) local user account.
  The V25/Generation-26 XMRig campaign abuses the legitimate pam_rootok policy so that
  root can su into many low-privileged accounts without a password, fragmenting malicious
  activity across identities as a forensic smokescreen. A single event is benign for admins;
  the malicious signal is a BURST of distinct target users from root in a short window --
  push that threshold and the distinct-user count to SIEM aggregation (see description).
references:
  - https://www.group-ib.com/blog/xmrig-covert-linux-pam-abuse/
  - https://attack.mitre.org/techniques/T1556/
author: Jarmi
date: 2026/07/31
tags:
  - attack.privilege-escalation
  - attack.defense-evasion
  - attack.t1556
  - attack.t1078.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_su:
    Image|endswith: '/su'
  selection_target:
    CommandLine|contains:
      - 'su - '
      - 'su -l '
      - 'su --login '
  filter_root_target:
    CommandLine|contains:
      - 'su - root'
      - 'su -l root'
      - 'su --login root'
  condition: selection_su and selection_target and not filter_root_target
falsepositives:
  - Legitimate administrators or automation using su to operate as service accounts. Baseline
    which parents and users normally do this; the campaign pattern is many distinct targets
    from root in minutes with no preceding failed authentications.
fields:
  - CommandLine
  - User
  - ParentImage

level: medium
