<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">Joyfill npm compromise - on-import RAT with blockchain dead-drop C2 kill chain</title>
<desc id="d">Two lanes. Left: the victim developer machine or CI runner from importing a trojanized Joyfill 2773 npm build, through an in-memory obfuscated loader, stashing Node require and module under short globals, resolving the command and control server from a public blockchain dead drop, opening a plain-HTTP Socket.IO remote access trojan channel, injecting a loader stub into the global npm CLI and Electron app bundles for worm self-propagation, and running a Python credential stealer that exfiltrates browser, wallet, SSH, Git and keychain secrets. Right: the attacker infrastructure publishing the 2773 beta builds to the npm registry, the Tron transaction dead-drop pointer, the BNB Smart Chain transaction whose XOR-decrypted input is the next stage, the plain-HTTP C2 host 166.88.134.62 on port 443, the boot downloader with the Sec-V campaign header, and the file collection endpoint slash u slash f. Detection anchors: a build or CI node process contacting public blockchain APIs, a plain-HTTP Socket.IO channel on port 443 to an unfamiliar IP, and writes into npm slash lib slash cli.js.</desc>
