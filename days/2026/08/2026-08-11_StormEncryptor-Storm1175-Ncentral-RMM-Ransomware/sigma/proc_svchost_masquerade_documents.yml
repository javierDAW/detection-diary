title: svchost.exe Masquerade Running From a User Documents Folder
id: 6f929cc8-e405-4fa4-83e7-2de0302aa2a6
status: experimental
description: |
  Detects a process named svchost.exe executing from a user profile Documents folder. In the
  Storm-1175 StormEncryptor intrusions, after exploiting the N-able N-central RMM auth bypass
  (CVE-2026-18577) and pivoting to managed endpoints via the built-in Take Control feature, the
  actor planted a svchost.exe in the user's Documents directory. The legitimate Windows service
  host only ever runs from System32 or SysWOW64, so any svchost.exe launched from a user-writable
  Documents path is high-signal. Correlate with a Cloudflared service and inbound Take Control
  sessions on the same host. Push time-window correlation to the SIEM.
references:
  - https://www.bleepingcomputer.com/news/security/new-stormencryptor-ransomware-used-by-former-medusa-affiliate/
  - https://status.n-able.com/2026/08/02/n-central-2026-3-hotfix-1-mitigation-for-cve-2026-18577/
  - https://attack.mitre.org/techniques/T1036/005/
author: Jarmi
date: 2026/08/11
tags:
  - attack.defense-evasion
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\svchost.exe'
    Image|contains: '\Documents\'
  condition: selection
falsepositives:
  - Legitimate svchost.exe never runs from a Documents folder; any hit warrants investigation.

level: high
