title: Cloudflared Tunnel Client Execution For Persistent Remote Access
id: fcd0234d-192c-4099-a033-5d1be67de932
status: experimental
description: |
  Detects execution of the Cloudflare Tunnel client (cloudflared) with tunnel run arguments or a
  connector token. Storm-1175 deployed cloudflared and registered it as a Windows service named
  Cloudflared to establish persistent outbound remote access to endpoints reached through the
  compromised N-able N-central RMM server. Cloudflared is a legitimate tool, so alert on unexpected
  hosts and on service installation rather than on developer workstations that legitimately run it.
  Correlate with a Cloudflared service registration and a svchost.exe planted in Documents.
references:
  - https://www.rapid7.com/blog/post/etr-cve-2026-18577-n-able-n-central-authentication-bypass-exploited-in-the-wild/
  - https://status.n-able.com/2026/08/02/n-central-2026-3-hotfix-1-mitigation-for-cve-2026-18577/
  - https://attack.mitre.org/techniques/T1572/
author: Jarmi
date: 2026/08/11
tags:
  - attack.command-and-control
  - attack.persistence
  - attack.t1572
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\cloudflared.exe'
  selection_cli:
    CommandLine|contains:
      - 'tunnel run'
      - '--token'
      - 'trycloudflare'
  condition: selection_img and selection_cli
falsepositives:
  - Developers and IT staff who legitimately run Cloudflare Tunnel; scope by host and by service install.

level: high
