title: ByteToCrypt Fixed Anti-Forensics Command Block on Linux
id: 16932067-a94d-4356-b3a1-85b5ed410314
status: experimental
description: >
  Detects the fixed nine-command anti-forensics block that the ByteToCrypt Linux ransomware
  runs via system() after its encryption pass: killing logging daemons, disabling auditd,
  clearing the kernel ring buffer, wiping /var/log and audit config, and truncating utmp/lastlog.
  The routine runs even if encryption failed, so it is a high-signal impact indicator. Correlate
  multiple hits in a short window (threshold pushed to SIEM aggregation).
references:
  - https://tlpblack.net/blog/20260728-a-deep-dive-into-bytetobreach-s-bytetocrypt-ransomware
  - https://attack.mitre.org/techniques/T1562/001/
author: Jarmi
date: 2026/08/04
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - attack.t1489
  - attack.t1070.002
logsource:
  product: linux
  category: process_creation
detection:
  selection_kill_logging:
    Image|endswith:
      - '/killall'
      - '/pkill'
    CommandLine|contains|all:
      - 'rsyslogd'
      - 'auditd'
  selection_disable_audit:
    CommandLine|contains:
      - 'auditctl -e 0'
      - 'dmesg -C'
  selection_wipe_logs:
    CommandLine|contains|all:
      - 'rm '
      - '/var/log/'
    CommandLine|contains:
      - '/var/log/journal'
      - '/etc/audit'
      - '/run/log/journal'
  selection_truncate_records:
    CommandLine|contains|all:
      - 'truncate '
    CommandLine|contains:
      - '/var/run/utmp'
      - '/var/log/lastlog'
  condition: 1 of selection_*
falsepositives:
  - Legitimate host decommissioning or aggressive log-rotation scripts. Correlate with bulk
    '*.encrypted' renames or a ransom 'note' write to raise fidelity.
fields:
  - CommandLine
  - Image
  - User
  - ParentImage

level: high
