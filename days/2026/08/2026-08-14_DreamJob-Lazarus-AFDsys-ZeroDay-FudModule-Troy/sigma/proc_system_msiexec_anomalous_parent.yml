title: SYSTEM msiexec.exe With a Non-Installer Parent (FudModule Injection Target)
id: 89f38a01-c5d7-4b37-aeee-c0ce63e57289
status: experimental
description: |
  Detects msiexec.exe running as SYSTEM (NT AUTHORITY\SYSTEM) with a parent that
  is not a normal Windows Installer flow. After exploiting CVE-2026-68820 in
  AFD.sys, Lazarus' FudModule 3.1 injects MISTPEN into a SYSTEM msiexec.exe child
  and, from that process, tampers with Smart App Control. A SYSTEM msiexec.exe
  spawned by something other than services.exe / the installer service, or with
  no MSI on its command line, is anomalous. This is a heuristic; confirm with a
  module-load / injection signal on the same process and with EDR/ETW health.
references:
  - https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/
  - https://cybersecuritynews.com/windows-afd-sys-zero-day-exploited/
author: Jarmi
date: 2026/08/14
tags:
  - attack.privilege-escalation
  - attack.defense-evasion
  - attack.t1055.001
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_proc:
    Image|endswith: '\msiexec.exe'
    User|contains:
      - 'SYSTEM'
      - 'SISTEMA'
  filter_installer_parent:
    ParentImage|endswith:
      - '\services.exe'
      - '\msiexec.exe'
      - '\svchost.exe'
  filter_msi_cmdline:
    CommandLine|contains:
      - '.msi'
      - '/i '
      - '/x '
      - '/qn'
      - '/quiet'
  condition: selection_proc and not (filter_installer_parent or filter_msi_cmdline)
falsepositives:
  - Rare software deployment or management tooling that launches msiexec.exe as SYSTEM without an MSI argument; baseline per environment.

level: high
