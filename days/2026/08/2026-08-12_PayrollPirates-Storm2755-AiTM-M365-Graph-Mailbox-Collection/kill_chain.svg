<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">Payroll Pirates kill chain - AiTM M365 takeover (Storm-2755 overlap)</title>
<desc id="d">Two lanes. Left: a victim Microsoft 365 identity from a voicemail-themed phishing lure and multi-stage redirect, through a browser-fingerprinting and geolocation gate that sets an rcfh_country cookie, an adversary-in-the-middle relay of the genuine Microsoft sign-in that captures session tokens even with MFA, automated session refresh every eight hours from rotating residential proxies with the same SessionID, Microsoft Graph reconnaissance of payroll and finance users, and coordinated mailbox collection with selective inbox-hiding rules. Right: the Payroll Pirates automation and infrastructure - the Google Meet, Google Ads and Amazon S3 redirect chain, the OpenResty and Express AiTM proxy with its PHP fingerprinting component, the anyIP residential proxy pool, the axios Graph automation, and the coordinated collection aimed at diverting payroll. Detection anchors: one SessionID across multiple ASNs at an eight-hour cadence, error 90014 on OfficeHome, the anomalous Outlook application and undocumented API pairing for MailItemsAccessed, and Graph enumeration of finance roles.</desc>
<defs>
