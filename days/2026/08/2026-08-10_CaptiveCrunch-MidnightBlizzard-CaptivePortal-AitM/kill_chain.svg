<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">CaptiveCrunch kill chain - Storm-2945 captive-portal AitM</title>
<desc id="d">Two lanes. Left: a victim Windows host on a compromised hotel captive portal - joining the manipulated Wi-Fi, receiving a fake update or device code prompt via ClickFix, running the CornFlake Go RAT dropper that copies to AppData as svchost32 and registers a Cloud Sync Service, then the ChocoShell in-memory PowerShell stealer with UAC bypass and SYSTEM token, credential and token theft, and Entra device code phishing. Right: Storm-2945 infrastructure - the compromised captive-portal ecosystem and DNS resolvers, doppelganger M365 domains, an adversary-in-the-middle proxy with device code redirect, the ChocoShell C2 at 213.145.86.112, the unauthenticated FruitStone operator panel, and exfiltration of cloud credentials and tokens for SVR espionage. Detection anchors: connectivity-check then executable write, svchost32 Cloud Sync Service masquerade, browser remote-debugging cookie theft, and anomalous Entra device code grants.</desc>
