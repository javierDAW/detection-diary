title: npm preinstall Running setup.mjs Then a Downloaded Bun Runtime (Shai-Hulud keyv/cacheable Loader)
id: 6aea418f-430a-4211-87cf-2a6e03ea05ef
status: experimental
description: |
  Detects the Stage-1 loader execution chain of the keyv/cacheable npm worm (a third-wave
  Shai-Hulud variant, Socket/SafeDep 2026-08-04). A trojanized package adds a package.json
  preinstall hook of 'node setup.mjs'; the loader then downloads a standalone Bun 1.3.13
  runtime into a temporary 'bun-dl-*' directory and executes the Stage-2 bundle
  (Math_Symbol.js) with it, so the second stage runs under bun rather than node and can
  bypass controls that watch only node processes. The high-signal artifacts are: a node
  process whose command line references 'setup.mjs' spawned as an npm lifecycle child, and a
  'bun' binary executed from a 'bun-dl-' path or a temp directory. Correlate the two with a
  parent npm/CI/dev process. Threshold and time-window correlation with the install belong in
  the SIEM.
references:
  - https://socket.dev/blog/popular-npm-packages-in-the-keyv-and-cacheable-namespaces-compromised-in-active-supply-chain
  - https://safedep.io/keyv-npm-supply-chain-compromise/
  - https://attack.mitre.org/techniques/T1204/003/
  - https://attack.mitre.org/techniques/T1059/007/
author: Jarmi
date: 2026/08/06
tags:
  - attack.execution
  - attack.t1059.007
  - attack.initial-access
  - attack.t1195.002
  - attack.t1204.003
logsource:
  category: process_creation
detection:
  selection_setup:
    Image|endswith:
      - '\node.exe'
      - '/node'
    CommandLine|contains: 'setup.mjs'
  selection_bun_img:
    Image|endswith:
      - '\bun.exe'
      - '/bun'
  selection_bun_path:
    Image|contains:
      - 'bun-dl-'
      - '\Temp\'
      - '/tmp/'
      - '\AppData\Local\Temp'
  selection_preinstall:
    ParentCommandLine|contains: 'preinstall'
    CommandLine|contains: 'setup.mjs'
  condition: selection_setup or (selection_bun_img and selection_bun_path) or selection_preinstall
falsepositives:
  - Legitimate projects that genuinely ship a setup.mjs and run Bun from a temp location; baseline the project and the source package/version and confirm the parent is an expected install
level: high
