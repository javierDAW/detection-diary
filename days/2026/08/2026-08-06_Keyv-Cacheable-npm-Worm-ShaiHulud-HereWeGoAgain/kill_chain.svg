<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="t d">
<title id="t">Keyv/Cacheable npm worm kill chain</title>
<desc id="d">Two lanes. Left: developer and CI host plus the npm registry - a trojanized keyv/cacheable version installed via a package.json preinstall hook, a Stage-1 Bun loader in setup.mjs that downloads a standalone Bun 1.3.13 runtime, a ~728 KB Stage-2 Bun bundle, credential collection from cloud IMDS, Vault, Kubernetes and npm and GitHub tokens, self-propagation that republishes trojanized packages through stolen npm OIDC identity, persistence via .claude and .vscode autostart hooks and a gh-token-monitor dead-man's switch, and impact. Right: attacker infrastructure - the compromised maintainer account, the Bun runtime download host, npm OIDC trusted publishing, sigstore provenance minting via Fulcio and Rekor, GitHub exfiltration repositories named Shai-Hulud Here We Go Again, and a DNS-based DomainSender. Detection anchors: node setup.mjs spawning bun from a bun-dl temp dir, writes to the repo hooks and the dead-man's switch, install-time node or bun reaching IMDS or the npm OIDC token exchange, and a republish burst from our own identity.</desc>
