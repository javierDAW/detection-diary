title: macOS Process Fetching a Public iCloud Calendar or Calendar Attachment by URL
id: 707d983b-535c-4770-8cdc-9ea6cf304fc6
status: experimental
description: |
  Detects a process whose command line contains a published iCloud calendar URL (caldav.icloud.com/published/) or an iCloud calendar
  attachment URL (gateway.icloud.com/caldav/). In the September 2026 MacSync variant, the stage 2 downloader reads a public iCloud
  calendar line by line and pipes it into zsh; lines before the DESCRIPTION: line fail as invalid commands and the lines after it run.
  A second URL on gateway.icloud.com serves Loader.app.tar.gz as a calendar attachment. Both hosts are legitimate Apple services,
  so the signal is the requesting process and its command line, not the destination. Securelist does not say which tool the
  downloader uses, so this rule only fires when the URL is visible in a command line; the KQL and Suricata files cover other views.
references:
  - https://securelist.com/macsync-new-version/121383/
  - https://www.kaspersky.com/about/press-releases/kaspersky-discovers-a-new-version-of-macsync-malware-stealing-credentials-and-crypto-from-macos-users
author: Jarmi
date: 2026/09/24
tags:
  - attack.command-and-control
  - attack.t1102
  - attack.execution
  - attack.t1059.004
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    CommandLine|contains:
      - 'caldav.icloud.com/published/'
      - 'gateway.icloud.com/caldav/'
  condition: selection
falsepositives:
  - Administrators or users who subscribe to a published iCloud calendar with curl or a script
  - Calendar clients that pass the subscription URL as a command-line argument

level: medium
